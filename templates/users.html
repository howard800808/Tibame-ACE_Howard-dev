<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ range(1, 10000) | random }}">
    <script src="/static/script.js?v={{ range(1, 10000) | random }}"></script>
</head>
<body class="users-page">
    <!-- 側邊選單 -->
    {% include 'sidebar.html' %}

    <!-- 主內容區 -->
    <div class="main-content">
        <div class="container">
            <!-- Header -->
            {% include 'top.html' %}

        <!-- User List Card -->
        <div class="card">
            <h2>📋 使用者列表</h2>
            
            <!-- Search Box -->
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜尋使用者名稱或 Email...">
                <button class="btn-primary" onclick="searchUsers()">搜尋</button>
                <button class="btn-primary" onclick="resetSearch()">重置</button>
            </div>

            <!-- User Table -->
            <table class="user-table" id="userTable">
                <thead>
                    <tr>
                        <th>使用者</th>
                        <th>Email</th>
                        <th>全名</th>
                        <th>狀態</th>
                        <th>建立時間</th>
                        <th>最後更新</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            載入中...
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Stats -->
            <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0; color: #666;">
                <strong>總使用者數:</strong> <span id="userCount">0</span>
            </div>
        </div>
        </div>
    </div>
    <script>
        function searchUsers() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const table = document.getElementById('userTable');
            const tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td');
                let found = false;
                
                for (let j = 0; j < td.length; j++) {
                    if (td[j]) {
                        const txtValue = td[j].textContent || td[j].innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            found = true;
                            break;
                        }
                    }
                }
                
                tr[i].style.display = found ? '' : 'none';
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            searchUsers();
        }

        // Real-time search
        document.getElementById('searchInput')?.addEventListener('keyup', searchUsers);

        // 定義驗證成功後的回調函數
        window.onAuthSuccess = function(userData, token) {
            // 載入使用者列表
            loadUsersList(token);
        };

        // 載入使用者列表
        async function loadUsersList(token) {
            try {
                const response = await fetch('/api/users/', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    throw new Error('無法載入使用者列表');
                }

                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                console.error('載入使用者失敗:', error);
                document.getElementById('userTableBody').innerHTML = 
                    '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">載入失敗</td></tr>';
            }
        }

        // 顯示使用者列表
        function displayUsers(users) {
            const tbody = document.getElementById('userTableBody');
            document.getElementById('userCount').textContent = users.length;

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">目前沒有使用者</td></tr>';
                return;
            }

            const html = users.map(user => {
                const statusBadge = user.is_active 
                    ? '<span class="status-badge status-active">啟用中</span>'
                    : '<span class="status-badge status-inactive">已停用</span>';
                
                const createdAt = new Date(user.created_at).toLocaleString('zh-TW');
                const updatedAt = new Date(user.updated_at).toLocaleString('zh-TW');

                return `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <div class="user-avatar">${user.username[0].toUpperCase()}</div>
                                <strong>${user.username}</strong>
                            </div>
                        </td>
                        <td>${user.email || '未設定'}</td>
                        <td>${user.full_name || '未設定'}</td>
                        <td>${statusBadge}</td>
                        <td>${createdAt}</td>
                        <td>${updatedAt}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
