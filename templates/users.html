<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }

        /* 側邊選單樣式 */
        .sidebar {
            width: 260px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sidebar-header h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .menu-section {
            padding: 15px 0;
        }

        .menu-title {
            padding: 10px 20px;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: bold;
        }

        .menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #333;
            text-decoration: none;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background: #f8f9ff;
            border-left-color: #667eea;
            color: #667eea;
        }

        .menu-item.active {
            background: #f8f9ff;
            border-left-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }

        .menu-icon {
            font-size: 18px;
            width: 20px;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .user-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .user-table th,
        .user-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .user-table tbody tr:hover {
            background: #f8f9ff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 10px;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- 側邊選單 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>🏢 TibaMe</h3>
            <p id="userRoleDisplay">USER</p>
        </div>
        
        <div class="menu-section">
            <div class="menu-title">主選單</div>
            <a href="/dashboard" class="menu-item">
                <span class="menu-icon">🏠</span>
                <span>儀表板</span>
            </a>
            <a href="/users" class="menu-item active" id="menu-users">
                <span class="menu-icon">👥</span>
                <span>人員管理</span>
            </a>
        </div>

        <div class="menu-section" id="admin-section" style="display: none;">
            <div class="menu-title">管理功能</div>
            <a href="#" class="menu-item" id="menu-roles">
                <span class="menu-icon">🔐</span>
                <span>角色管理</span>
            </a>
            <a href="#" class="menu-item" id="menu-factory">
                <span class="menu-icon">🏭</span>
                <span>廠房管理</span>
            </a>
            <a href="#" class="menu-item" id="menu-machine">
                <span class="menu-icon">⚙️</span>
                <span>機台管理</span>
            </a>
            <a href="#" class="menu-item" id="menu-material">
                <span class="menu-icon">📦</span>
                <span>品料管理</span>
            </a>
        </div>

        <div class="menu-section" id="manager-section" style="display: none;">
            <div class="menu-title">訂單管理</div>
            <a href="#" class="menu-item" id="menu-orders">
                <span class="menu-icon">🛒</span>
                <span>訂單管理</span>
            </a>
            <a href="#" class="menu-item" id="menu-schedule-ing">
                <span class="menu-icon">📋</span>
                <span>開工列表ing</span>
            </a>
            <a href="#" class="menu-item" id="menu-schedule-plan">
                <span class="menu-icon">📅</span>
                <span>製令單排程</span>
            </a>
            <a href="#" class="menu-item" id="menu-schedule-close">
                <span class="menu-icon">✅</span>
                <span>製令單Close</span>
            </a>
        </div>

        <div class="menu-section">
            <div class="menu-title">工作報告</div>
            <a href="#" class="menu-item" id="menu-report-all">
                <span class="menu-icon">📊</span>
                <span>報工單ALL</span>
            </a>
            <a href="#" class="menu-item" id="menu-report">
                <span class="menu-icon">📝</span>
                <span>報工單</span>
            </a>
        </div>
    </div>

    <!-- 主內容區 -->
    <div class="main-content">
        <div class="container">
            <!-- Header -->
        <div class="header">
            <h1>👥 使用者管理</h1>
            <div class="nav-buttons">
                <a href="/dashboard" class="nav-btn">回到儀表板</a>
                <button class="nav-btn" onclick="logout()">登出</button>
            </div>
        </div>

        <!-- User List Card -->
        <div class="card">
            <h2>📋 使用者列表</h2>
            
            <!-- Search Box -->
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜尋使用者名稱或 Email...">
                <button class="btn-primary" onclick="searchUsers()">搜尋</button>
                <button class="btn-primary" onclick="resetSearch()">重置</button>
            </div>

            <!-- User Table -->
            <table class="user-table" id="userTable">
                <thead>
                    <tr>
                        <th>使用者</th>
                        <th>Email</th>
                        <th>全名</th>
                        <th>狀態</th>
                        <th>建立時間</th>
                        <th>最後更新</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            載入中...
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Stats -->
            <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0; color: #666;">
                <strong>總使用者數:</strong> <span id="userCount">0</span>
            </div>
        </div>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            alert('已成功登出!');
            window.location.href = '/login';
        }

        function searchUsers() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const table = document.getElementById('userTable');
            const tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td');
                let found = false;
                
                for (let j = 0; j < td.length; j++) {
                    if (td[j]) {
                        const txtValue = td[j].textContent || td[j].innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            found = true;
                            break;
                        }
                    }
                }
                
                tr[i].style.display = found ? '' : 'none';
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            searchUsers();
        }

        // Real-time search
        document.getElementById('searchInput')?.addEventListener('keyup', searchUsers);

        // 檢查登入狀態和權限
        window.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            
            // Token 檢查
            if (!token) {
                alert('未偵測到登入憑證,請先登入');
                window.location.href = '/login';
                return;
            }

            // 驗證 Token 有效性並獲取使用者資訊
            fetch('/api/users/me', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Token 已過期或無效');
                }
                return response.json();
            })
            .then(userData => {
                // 儲存使用者資訊
                localStorage.setItem('user_info', JSON.stringify(userData));
                
                // 根據角色顯示選單
                const userRole = userData.role || 'user';
                document.getElementById('userRoleDisplay').textContent = userRole.toUpperCase();
                updateMenuByRole(userRole);
                
                // 載入使用者列表
                loadUsersList(token);
            })
            .catch(error => {
                console.error('驗證失敗:', error);
                alert('登入憑證已過期,請重新登入');
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_info');
                window.location.href = '/login';
            });
        });

        // 根據角色更新選單顯示
        function updateMenuByRole(role) {
            const adminSection = document.getElementById('admin-section');
            const managerSection = document.getElementById('manager-section');
            
            if (role === 'admin') {
                // 管理員可見所有選單
                adminSection.style.display = 'block';
                managerSection.style.display = 'block';
            } else if (role === 'manager') {
                // 經理只能看訂單管理
                adminSection.style.display = 'none';
                managerSection.style.display = 'block';
            } else {
                // 一般使用者只能看基本功能
                adminSection.style.display = 'none';
                managerSection.style.display = 'none';
            }
        }

        // 載入使用者列表
        async function loadUsersList(token) {
            try {
                const response = await fetch('/api/users/', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    throw new Error('無法載入使用者列表');
                }

                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                console.error('載入使用者失敗:', error);
                document.getElementById('userTableBody').innerHTML = 
                    '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">載入失敗</td></tr>';
            }
        }

        // 顯示使用者列表
        function displayUsers(users) {
            const tbody = document.getElementById('userTableBody');
            document.getElementById('userCount').textContent = users.length;

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">目前沒有使用者</td></tr>';
                return;
            }

            const html = users.map(user => {
                const statusBadge = user.is_active 
                    ? '<span class="status-badge status-active">啟用中</span>'
                    : '<span class="status-badge status-inactive">已停用</span>';
                
                const createdAt = new Date(user.created_at).toLocaleString('zh-TW');
                const updatedAt = new Date(user.updated_at).toLocaleString('zh-TW');

                return `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <div class="user-avatar">${user.username[0].toUpperCase()}</div>
                                <strong>${user.username}</strong>
                            </div>
                        </td>
                        <td>${user.email || '未設定'}</td>
                        <td>${user.full_name || '未設定'}</td>
                        <td>${statusBadge}</td>
                        <td>${createdAt}</td>
                        <td>${updatedAt}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
