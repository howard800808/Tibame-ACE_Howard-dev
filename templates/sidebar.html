<script>
    // 側邊選單權限控制
    function initSidebar(userData) {
        if (!userData) return;
        
        const role = userData.role || 'user';
        const dept = userData.department || '';
        
        // 更新顯示資訊
        const roleEl = document.getElementById('sidebarUserRole');
        const deptEl = document.getElementById('sidebarUserDept');
        
        if (roleEl) roleEl.textContent = role.toUpperCase();
        if (deptEl && dept) {
            deptEl.textContent = '部門: ' + dept.toUpperCase();
        }

        // 權限邏輯
        const isAdmin = role === 'admin';
        
        // 輔助函式：安全地顯示元素
        const showEl = (id) => {
            const el = document.getElementById(id);
            if (el) el.style.display = 'block';
        };
        
        // 顯示區塊控制
        if (isAdmin) {
            showEl('section-admin');
            showEl('section-production');
            showEl('section-warehouse');
            showEl('section-sales');
        } else {
            // 依照部門顯示
            if (dept === 'production' || role === 'manager') {
                showEl('section-production');
            }
            if (dept === 'warehouse') {
                showEl('section-warehouse');
            }
            if (dept === 'sales' || role === 'manager') {
                showEl('section-sales');
            }
        }

        // 設定當前啟動項目
        const currentPath = window.location.pathname;
        const menuDashboard = document.getElementById('menu-dashboard');
        const menuUsers = document.getElementById('menu-users');
        const menuTasks = document.getElementById('menu-tasks-all');

        if (currentPath === '/dashboard' && menuDashboard) {
            menuDashboard.classList.add('active');
        } else if (currentPath === '/users' && menuUsers) {
            menuUsers.classList.add('active');
        } else if (currentPath === '/tasks' && menuTasks) {
            menuTasks.classList.add('active');
        }
    }

    // 自動從 localStorage 載入或等待頁面驗證
    window.addEventListener('DOMContentLoaded', function() {
        const userInfo = localStorage.getItem('user_info');
        if (userInfo) {
            initSidebar(JSON.parse(userInfo));
        }
    });
</script>
