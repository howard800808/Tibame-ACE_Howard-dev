<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYS服務管理後台 - 登入</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/style.css?v={{ range(1, 10000) | random }}">
</head>
<body class="login-body">
    <div class="login-container">
        <!-- 左側面板 -->
        <div class="left-panel">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="/static/logo.gif" alt="ACE Logo" style="max-width: 150px;">
                <h1>JYS服務管理後台</h1>
            </div>
            <div class="features">
                <div class="feature-item">OAuth2.0 JWT 認證</div>
                <div class="feature-item">安全的密碼加密</div>
                <div class="feature-item">RESTful API 設計</div>
                <div class="feature-item">自動 API 文檔</div>
            </div>
        </div>

        <!-- 右側表單 -->
        <div class="right-panel">
            <div class="form-container">
                <div class="form-header">
                    <h2>歡迎回來</h2>
                    <p>請登入您的帳號以繼續</p>
                </div>

                <!-- Tab 切換 -->
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">登入</div>
                    <div class="tab" onclick="switchTab('register')">註冊</div>
                </div>

                <!-- 訊息提示 -->
                <div id="alert" class="alert"></div>

                <!-- 登入表單 -->
                <div id="loginForm" class="form-content active">
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="login-username">使用者名稱</label>
                            <input type="text" id="login-username" placeholder="請輸入使用者名稱" required value="admin">
                        </div>
                        <div class="form-group">
                            <label for="login-password">密碼</label>
                            <input type="password" id="login-password" placeholder="請輸入密碼" required value="admin123">
                        </div>
                        <button type="submit" class="btn" id="loginBtn">
                            登入
                        </button>
                    </form>
                    
                    <div class="footer-links">
                        <a href="/docs" target="_blank">API 文檔</a> | 
                        <a href="/redoc" target="_blank">ReDoc</a>
                    </div>
                </div>

                <!-- 註冊表單 -->
                <div id="registerForm" class="form-content">
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label for="register-username">使用者名稱 *</label>
                            <input type="text" id="register-username" placeholder="請輸入使用者名稱" required>
                        </div>
                        <div class="form-group">
                            <label for="register-email">電子郵件</label>
                            <input type="email" id="register-email" placeholder="請輸入電子郵件">
                        </div>
                        <div class="form-group">
                            <label for="register-fullname">全名</label>
                            <input type="text" id="register-fullname" placeholder="請輸入全名">
                        </div>
                        <div class="form-group">
                            <label for="register-password">密碼 *</label>
                            <input type="password" id="register-password" placeholder="請輸入密碼" required>
                        </div>
                        <button type="submit" class="btn" id="registerBtn">
                            註冊
                        </button>
                    </form>
                </div>

                <!-- 登入成功後顯示 -->
                <div id="userInfo" style="display: none;">
                    <div class="user-info">
                        <h3>✅ 登入成功</h3>
                        <div class="info-item">
                            <span class="label">使用者名稱:</span>
                            <span class="value" id="display-username"></span>
                        </div>
                        <div class="info-item">
                            <span class="label">電子郵件:</span>
                            <span class="value" id="display-email"></span>
                        </div>
                        <div class="info-item">
                            <span class="label">全名:</span>
                            <span class="value" id="display-fullname"></span>
                        </div>
                        <div class="info-item">
                            <span class="label">狀態:</span>
                            <span class="value" id="display-status"></span>
                        </div>
                    </div>

                    <div style="margin-top: 15px;">
                        <strong style="font-size: 14px; color: #333;">Access Token:</strong>
                        <div class="token-display" id="display-token"></div>
                    </div>

                    <button class="btn" onclick="logout()" style="margin-top: 20px;">
                        登出
                    </button>

                    <div class="footer-links">
                        <a href="/docs" target="_blank">前往 API 文檔</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        let currentToken = null;

        // Tab 切換
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            
            hideAlert();
        }

        // 顯示訊息
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
        }

        function hideAlert() {
            const alert = document.getElementById('alert');
            alert.classList.remove('show');
        }

        // 登入
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('loginBtn');
            
            btn.disabled = true;
            btn.innerHTML = '登入中<span class="loading"></span>';
            hideAlert();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login/json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || '登入失敗');
                }
                
                // 儲存 token
                localStorage.setItem('access_token', data.access_token);
                
                showAlert('登入成功！正在跳轉...', 'success');
                
                // 跳轉到儀表板
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
                
            } catch (error) {
                showAlert(error.message || '登入失敗，請檢查帳號密碼', 'error');
                btn.disabled = false;
                btn.textContent = '登入';
            }
        }

        // 註冊
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const full_name = document.getElementById('register-fullname').value;
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('registerBtn');
            
            btn.disabled = true;
            btn.innerHTML = '註冊中<span class="loading"></span>';
            hideAlert();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        email: email || null,
                        full_name: full_name || null,
                        password,
                        is_active: true
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || '註冊失敗');
                }
                
                showAlert('註冊成功！請登入您的帳號', 'success');
                
                // 切換到登入頁面
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('login-username').value = username;
                }, 1500);
                
            } catch (error) {
                showAlert(error.message || '註冊失敗', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '註冊';
            }
        }

        // 取得使用者資訊
        async function fetchUserInfo(token) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const user = await response.json();
                
                if (!response.ok) {
                    throw new Error('無法取得使用者資訊');
                }
                
                // 顯示使用者資訊
                document.getElementById('display-username').textContent = user.username;
                document.getElementById('display-email').textContent = user.email || '-';
                document.getElementById('display-fullname').textContent = user.full_name || '-';
                document.getElementById('display-status').textContent = user.is_active ? '✓ 已啟用' : '✗ 未啟用';
                document.getElementById('display-token').textContent = token;
                
                // 隱藏表單，顯示使用者資訊
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'none';
                document.querySelector('.tabs').style.display = 'none';
                document.querySelector('.form-header').style.display = 'none';
                document.getElementById('userInfo').style.display = 'block';
                hideAlert();
                
            } catch (error) {
                showAlert('取得使用者資訊失敗', 'error');
            }
        }

        // 登出
        function logout() {
            currentToken = null;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.querySelector('.tabs').style.display = 'flex';
            document.querySelector('.form-header').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
            
            // 清空表單
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            
            switchTab('login');
            showAlert('已登出', 'info');
        }

        // 測試預設帳號提示
        window.onload = function() {
            console.log('預設測試帳號: admin / admin123');
        };
    </script>
</body>
</html>
