<!-- 頂部導航欄組件 -->
<div class="header">
    <h1>{{ header_title | default(system_name) }}</h1>
    <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-details">
            <span class="user-name" id="userName">載入中...</span>
            <span class="user-email" id="userEmail">-</span>
            <span class="user-last-login" id="userLastLogin" style="font-size: 11px; color: #aaa; margin-top: 2px;"></span>
        </div>
        
        <button class="logout-btn" onclick="logout()">登出</button>
        <button class="home-btn" onclick="location.href='/dashboard'" title="回首頁" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-right: 15px; font-size: 14px; transition: all 0.3s;">🏠</button>
    </div>
</div>
